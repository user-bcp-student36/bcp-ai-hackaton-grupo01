<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-labelledby="t">
  <title id="t">Ilustración de un celular con una billetera, monedas y un código QR</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6edfa"/>
      <stop offset="1" stop-color="#cfe8f7"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a41a3"/>
      <stop offset="1" stop-color="#001d63"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00a9e0"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffd089"/>
      <stop offset="1" stop-color="#ff7800"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#001d63" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .float { animation: float 5s ease-in-out infinite; }
    .float-slow { animation: float 7s ease-in-out infinite reverse; }
    .spin { transform-origin: 240px 200px; animation: spin 40s linear infinite; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .float, .float-slow, .spin { animation: none; } }
  </style>

  <rect width="480" height="400" rx="32" fill="url(#bg)"/>
  <g class="spin" fill="none" stroke="#002a8d" stroke-opacity="0.18">
    <circle cx="240" cy="200" r="150" stroke-dasharray="4 10"/>
    <circle cx="240" cy="200" r="110"/>
    <circle cx="390" cy="200" r="7" fill="#00a9e0" stroke="none"/>
    <circle cx="130" cy="310" r="5" fill="#ff7800" stroke="none"/>
  </g>

  <g class="float" filter="url(#shadow)">
    <rect x="180" y="50" width="120" height="250" rx="22" fill="url(#phone)"/>
    <rect x="188" y="62" width="104" height="226" rx="14" fill="#f1f4fb"/>
    <rect x="224" y="55" width="32" height="5" rx="2.5" fill="#001d63"/>
    <rect x="197" y="76" width="86" height="52" rx="10" fill="url(#card)"/>
    <circle cx="211" cy="94" r="7" fill="#ffffff" fill-opacity="0.85"/>
    <rect x="205" y="110" width="40" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="197" y="138" width="86" height="10" rx="5" fill="#c8d3ec"/>
    <rect x="197" y="156" width="60" height="10" rx="5" fill="#c8d3ec"/>
    <rect x="197" y="182" width="86" height="40" rx="10" fill="#002a8d"/>
    <path d="M222 202l8 8 14-16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="197" y="232" width="86" height="40" rx="10" fill="#ffffff" stroke="#c8d3ec"/>
    <rect x="207" y="242" width="20" height="20" rx="3" fill="#14213d"/>
    <rect x="211" y="246" width="12" height="12" rx="1" fill="#ffffff"/>
    <rect x="214" y="249" width="6" height="6" fill="#14213d"/>
    <rect x="234" y="244" width="8" height="8" fill="#14213d"/>
    <rect x="246" y="244" width="8" height="8" fill="#14213d"/>
    <rect x="240" y="256" width="14" height="6" fill="#14213d"/>
    <rect x="260" y="250" width="12" height="12" fill="#14213d"/>
  </g>

  <g class="float-slow" filter="url(#shadow)">
    <circle cx="350" cy="120" r="34" fill="url(#coin)"/>
    <circle cx="350" cy="120" r="26" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
    <text x="350" y="132" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="32" font-weight="700" fill="#ffffff">S/</text>
  </g>
  <g class="float" filter="url(#shadow)" style="animation-delay:-2s">
    <circle cx="115" cy="250" r="26" fill="url(#coin)"/>
    <circle cx="115" cy="250" r="19" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="3"/>
    <text x="115" y="260" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="24" font-weight="700" fill="#ffffff">S/</text>
  </g>
  <g class="float-slow" style="animation-delay:-3s" filter="url(#shadow)">
    <rect x="95" y="90" width="76" height="40" rx="12" fill="#ffffff"/>
    <path d="M110 112l7 7 12-14" fill="none" stroke="#1b6b45" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="136" y="105" width="24" height="5" rx="2.5" fill="#c8d3ec"/>
    <rect x="136" y="115" width="16" height="5" rx="2.5" fill="#c8d3ec"/>
  </g>
</svg>
